services:
  - type: web
    name: cbt-new-aram
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    env: node
    plan: free
    healthCheckPath: /api/health
    disk:
      name: cbt-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://cbt-new-eight.vercel.app,http://localhost:5174
        sync: false
      - key: DB_PATH
        value: /var/data/cbt.db
        sync: false
      - key: UPLOADS_DIR
        value: /var/data/uploads
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
