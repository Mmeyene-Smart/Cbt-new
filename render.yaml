services:
  - type: web
    name: cbt-new-aram
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    env: node
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://cbt-new-eight.vercel.app,http://localhost:5174
        sync: false
      - key: VITE_API_URL
        value: https://cbt-new-aram.onrender.com
        sync: false
